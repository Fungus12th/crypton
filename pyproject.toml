[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypton"
version = "0.1.0"
description = "Secure Cross-Platform USB Vault and Google Drive Sync Tool"
authors = [{ name = "Crypton Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "fusepy>=3.0.1",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
crypton = "crypton.main:main"

[tool.setuptools.packages.find]
include = ["crypton*"]
